services:
  - type: web
    name: interviewiq
    runtime: node
    plan: starter
    buildCommand: bash scripts/build.sh
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    autoDeploy: true

databases:
  - name: interviewiq-db
    databaseName: interviewiq
    plan: starter
